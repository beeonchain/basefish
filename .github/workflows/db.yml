name: db migrate
on:
  workflow_dispatch:
    inputs:
      add_wallets:
        description: 'Wallets to whitelist (comma-separated)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'scripts/db_migrate.mjs'
      - 'data/access_code_hashes.json'

concurrency:
  group: db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save pg
      - name: migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          ADD_WALLETS: ${{ github.event.inputs.add_wallets }}
        run: |
          for w in $(echo "$ADD_WALLETS" | tr ',' ' '); do echo "::add-mask::$w"; done
          node scripts/db_migrate.mjs
      - name: commit status
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/db_status.json
          git diff --cached --quiet || git commit -m "db: status after migrate $(date -u +%H:%M)"
          git pull -q --rebase origin main || true
          git push -q origin main

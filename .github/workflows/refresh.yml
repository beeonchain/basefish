name: Refresh holder data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours (keeps Moralis free tier comfortable)

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch holder data
        env:
          MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
          BITQUERY_TOKEN: ${{ secrets.BITQUERY_TOKEN }}
        run: node scripts/fetch.mjs
      - name: Commit data
        run: |
          git config user.name "basefish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" || git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M')"
          git push

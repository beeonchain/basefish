name: Refresh holder data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours (keeps Moralis free tier comfortable)

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch holder data
        env:
          MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
          BITQUERY_TOKEN: ${{ secrets.BITQUERY_TOKEN }}
          FRONTRUN_API_KEY: ${{ secrets.FRONTRUN_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: node scripts/fetch.mjs
      - name: Commit data
        run: |
          git config user.name "basefish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" || git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M')"
          # the instant-alert webhook and the Telegram bot commit to main at any time —
          # rebase onto whatever landed during this run, then push (retry a few times)
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && break
            echo "push rejected, retrying ($i)"; sleep 10
          done

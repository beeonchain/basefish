name: Refresh holder data

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "hot (tier-hot tokens only) or all (every token + daily discovery)"
        default: "hot"
        required: false
      only:
        description: "comma-separated symbols to refresh (testing), e.g. BRETT,AERO"
        default: ""
        required: false
  # schedules live in Netlify (netlify/functions/cron_hot.mjs / cron_all.mjs) — GitHub's cron was skipping slots

permissions:
  contents: write

# single-token fetches (inputs.only) run in their own lane so a user's "Fetch full data" never waits behind the 2-hourly refresh
run-name: ${{ github.event.inputs.only != '' && format('fetch {0}', github.event.inputs.only) || format('refresh {0}', github.event.inputs.tier || 'hot') }}
concurrency:
  group: ${{ github.event.inputs.only != '' && format('fetch-{0}', github.event.inputs.only) || 'refresh' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Decide tier
        id: tier
        run: |
          if [ "${{ github.event.schedule }}" = "47 4 * * *" ]; then T=all; else T="${{ github.event.inputs.tier || 'hot' }}"; fi
          echo "tier=$T" >> "$GITHUB_OUTPUT"; echo "tier=$T"
      - name: Discover tokens (daily)
        if: steps.tier.outputs.tier == 'all'
        run: node scripts/discover.mjs || echo "discover failed — keeping current token list"
      - name: Fetch holder data
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          ONLY: ${{ github.event.inputs.only }}
          MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
          BITQUERY_TOKEN: ${{ secrets.BITQUERY_TOKEN }}
          FRONTRUN_API_KEY: ${{ secrets.FRONTRUN_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ALCH_NOTIFY_TOKEN: ${{ secrets.ALCH_NOTIFY_TOKEN }}
        run: node scripts/fetch.mjs
      - name: Token logos for holder labels
        run: node scripts/toklogos.mjs || echo "toklogos failed — keeping current cache"
      - name: Commit data
        run: |
          git config user.name "whalarium-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ tokens.config.json
          git diff --cached --quiet && echo "no changes" || git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M') (${{ steps.tier.outputs.tier }})"
          # the instant-alert webhook and the Telegram bot commit to main at any time —
          # rebase onto whatever landed during this run, then push (retry a few times)
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && break
            echo "push rejected, retrying ($i)"; sleep 10
          done

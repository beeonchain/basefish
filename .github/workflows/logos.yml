name: Token logos

on:
  workflow_dispatch:
    inputs:
      max:
        description: "max symbols to resolve this run"
        default: "150"
        required: false

permissions:
  contents: write

concurrency:
  group: logos
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve logos (DexScreener → CoinGecko)
        env:
          LOGO_MAX: ${{ github.event.inputs.max }}
        run: node scripts/toklogos.mjs
      - name: Commit
        run: |
          git config user.name "whalarium-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/toklogos.json
          git diff --cached --quiet && echo "no changes" || git commit -m "data: token logos for holder labels"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; echo "push rejected, retrying ($i)"; sleep 10; done
